<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de citas</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js" defer></script>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="main.js" defer></script>

</head>
<body>
    <header class="top-bar">
        <button onclick="openPatientForm()" class="btn">Nuevo paciente</button>
        <button onclick="window.location.href='patients.html'" class="btn">Ver pacientes</button>
    </header>

    <div class="patient-form__overlay" id="patient-modal">
        <form class="patient-form">
            <h2>Registrar paciente</h2>

            <label>Nombre</label>
            <input type="text" id="patient-new-name">

            <label>Apellido</label>
            <input type="text" id="patient-new-lastname">

            <label>DNI</label>
            <input type="text" id="patient-new-dni">

            <label>Teléfono</label>
            <input type="text" id="patient-new-phone">

            <label>Email</label>
            <input type="email" id="patient-new-email">

            <div class="patient-form__buttons">
                <button type="button" onclick="savePatient()">Guardar</button>
                <button type="button" onclick="closePatientForm()">Cancelar</button>
            </div>
        </form>
    </div>

    <div id="calendar"></div>
    
    <div class="new-appointment__overlay">
        <form class="new-appointment">
    
            <h2 class="new-appointment__title">Registrar nueva cita</h2>

            <div class="patient-autocomplete">
                <label>Nombre del paciente</label>
                <input type="text" id="patient-name" oninput="searchPatients()" autocomplete="off">
                <div id="patient-suggestions" class="patient-suggestions"></div>
            </div>
            
            <label>Apellido del paciente</label>
            <input type="text" id="patient-lastname"/>

            <label>Teléfono</label>
            <input type="tel" id="patient-phone">

            <label>Email</label>
            <input type="email" id="patient-email">

            <label>Descripcion</label>
            <textarea rows="3" id="patient-description"></textarea>

            <label>Fecha</label>
            <input type="date" id="appointment-date" min=""/>

            <label>Hora Inicio</label>
            <input type="time" id="appointment-start"/>

            <label>Hora Fin</label>
            <input type="time" id="appointment-end"/>

            <div class="new-appointment__buttons">
                <button type="button" onclick="saveAppointment()">Guardar</button>
                <button type="button" onclick="closeForm()">Cancelar</button>
                <button type="button" class="delete-button" onclick="deleteAppointment()">Eliminar</button>
            </div>
        </form>
    </div>
    
    <div id="toast-container"></div>

    <div id="reminder-popup" class="reminder-popup hidden">
        <h3>Recordatorio de cita</h3>
        <p id="reminder-message"></p>
        <button onclick="closeReminder()">Cerrar</button>
    </div>
</body>
</html>
